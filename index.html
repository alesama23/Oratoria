<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OratoriaPro Master v4</title>
    <style>
        :root { --bg: #0b0b0f; --surface: #16161f; --primary: #00e676; --accent: #29b6f6; --text: #ffffff; --text-muted: #8d8d99; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-bottom: 60px; }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { color: var(--primary); text-align: center; margin-bottom: 5px; font-size: 1.8rem; }
        .subtitle { text-align: center; color: var(--text-muted); margin-top: 0; margin-bottom: 25px; font-size: 0.95rem; }
        
        /* Sistema de Módulos (Acordeón) */
        .module { background: var(--surface); border-radius: 12px; margin-bottom: 12px; overflow: hidden; border: 1px solid #2a2a35; }
        .module-header { padding: 15px 20px; background: #1e1e28; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1rem; }
        .module-header:hover { background: #252533; }
        .module-content { padding: 0; display: none; }
        .module.active .module-content { display: block; }
        .module.active .module-header { border-bottom: 1px solid #2a2a35; color: var(--primary); }
        
        /* Lista de ejercicios */
        .exercise-list { list-style: none; padding: 0; margin: 0; }
        .exercise-list li { padding: 15px 20px; background: #16161f; border-bottom: 1px solid #22222c; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
        .exercise-list li:last-child { border-bottom: none; }
        .exercise-list li:hover { background: #1e1e28; }
        .exercise-list li.selected { border-left: 4px solid var(--primary); background: #10251a; }
        
        /* Zona de Práctica */
        .practice-zone { background: #000000; padding: 20px; border-radius: 16px; margin-top: 25px; border: 1px solid #333; display: none; }
        
        /* Caja de Teoría y Estrategia */
        .theory-box { background: #101a24; border-left: 4px solid var(--accent); padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; line-height: 1.5; color: #ced4da; }
        .theory-box b { color: var(--accent); }

        /* Guion o Premisa */
        .script-box { background: #16161f; padding: 20px; border-radius: 10px; border: 1px solid #2a2a35; margin-bottom: 20px; }
        .script-type { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); margin-bottom: 8px; font-weight: bold; }
        #script-text { font-size: 1.25rem; line-height: 1.6; color: #fff; font-weight: 300; }
        
        button { background: var(--primary); color: #000; border: none; padding: 16px; border-radius: 30px; font-size: 1.1rem; font-weight: bold; width: 100%; cursor: pointer; transition: 0.2s; }
        button.recording { background: #ff3366; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }
        
        .ia-feedback { margin-top: 25px; padding: 20px; background: #0b2e1f; border: 1px solid var(--primary); border-radius: 12px; display: none; }
        .loader { display: none; text-align: center; margin-top: 15px; color: var(--primary); font-style: italic; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎙️ OratoriaPro Academy</h1>
    <p class="subtitle">Entrenador Vocal de Alta Competencia para Radio y Público</p>

    <div id="modules-container"></div>

    <div class="practice-zone" id="practice-zone">
        <h3 id="exercise-title" style="color: var(--primary); margin-top: 0; font-size: 1.3rem;"></h3>
        
        <div class="theory-box" id="theory-box"></div>
        
        <div class="script-box">
            <div class="script-type" id="script-type">Lectura</div>
            <div id="script-text"></div>
        </div>

        <button id="record-btn">🎤 Iniciar Grabación</button>
        <p id="instruction-sub" style="font-size: 0.8rem; text-align: center; color: var(--text-muted); margin-top: 10px;"></p>
        
        <div class="loader" id="loader">🔄 El Profesor IA está procesando tu entrega vocal...</div>
        
        <div class="ia-feedback" id="feedback-area">
            <h4 style="margin-top: 0; color: var(--primary); font-size: 1.1rem; display: flex; align-items: center; gap: 8px;">🧠 Evaluación del Profesor:</h4>
            <p id="ia-response" style="line-height: 1.6; font-size: 1rem; margin-bottom: 15px; color: #f0f0f0;"></p>
            <hr style="border-color: #144d34; margin: 15px 0;">
            <p style="font-size: 0.85rem; color: #a2cfb6; margin: 0;"><b>Lo que capturó tu micrófono:</b> <br><i id="transcript" style="color: #fff;"></i></p>
        </div>
    </div>
</div>
